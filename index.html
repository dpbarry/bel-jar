<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Home: your projects and the account. It loads no editor and starts no
       Beluga (js/home.js; the editor is edit.html, at /edit?p=ID).
       One address. BelJar moved off GitHub Pages to beljar.deanbarry.com: the
       online features need the app and its API on one site, and browser storage
       belongs to the origin, so a second live copy would split everyone's
       projects in two. Old links land on the same page at the new address.
       tests/test-canonical-redirect.mjs pins where it fires and where it never may. -->
  <script>
    (function () {
      if (location.hostname !== 'dpbarry.github.io') return;
      var path = location.pathname.replace(/^\/bel-jar(?=\/|$)/, '') || '/';
      location.replace('https://beljar.deanbarry.com' + path + location.search + location.hash);
    })();
  </script>
  <!-- The deployed hosts: a server always answers /api there, so an account that
       cannot be reached is a failure to explain, never "no server"
       (js/account/account.mjs), and the site answers the short addresses
       (js/frame/routes.mjs). The same list as edit.html's. Before early boot,
       which may send this page on to the last project and needs the address. -->
  <script>
    (function () {
      var h = location.hostname;
      window.BELJAR_DEPLOYED = ['deanbarry.com', 'workers.dev', 'pages.dev'].some(function (d) {
        return h === d || h.endsWith('.' + d);
      });
    })();
  </script>
  <script src="js/boot/early-boot.js"></script>
  <!-- Nothing is painted until home's script has drawn the list: no empty page
       first, and the row a transition from the editor lands on is there. -->
  <link rel="expect" href="#home-drawn" blocking="render">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BelJar</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <!-- The navigation between home and the editor is animated by the browser
       (css/page-transition.css). ⛔ The opt-in is here, in the document, and in
       both documents: in a stylesheet reached through @import the editor's was
       not seen in time and the transition was refused (measured 2026-10-02), and
       a page without it gets a hard cut and no error. -->
  <style>@view-transition { navigation: auto; }</style>
</head>

<body class="home-page">

  <header>
    <div class="header-start">
      <span class="header-brand home-brand" aria-hidden="true">
        <svg class="header-logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M 25 65 Q 37.5 50, 50 60 T 75 55 V 80 H 25 Z" fill="currentColor" fill-opacity="0.2" stroke="none" />
          <path d="M 25 72 Q 40 60, 55 68 T 75 62 V 80 H 25 Z" fill="currentColor" fill-opacity="0.15" stroke="none" />
          <path d="M 25 65 Q 37.5 50, 50 60 T 75 55" stroke-width="3" />
          <path d="M 44 20 V 14 C 44 9, 56 9, 56 14 V 20 Z" fill="currentColor" fill-opacity="0.15" />
          <path d="M 25 80 V 45 A 25 25 0 0 1 75 45 V 80" />
          <path d="M 33 45 A 17 17 0 0 1 42 30" stroke-width="4" opacity="0.4" />
          <path d="M 18 80 V 86 C 18 94, 30 96, 50 96 C 70 96, 82 94, 82 86 V 80 Z" fill="currentColor" fill-opacity="0.15" />
          <circle cx="58" cy="44" r="3.5" stroke-width="2.5" />
        </svg>
      </span>
    </div>
    <div class="header-context" aria-hidden="true"></div>
    <div class="header-end">
      <button id="btn-sync" type="button" class="icon-btn sync-cloud" aria-label="All changes synced" aria-haspopup="menu" aria-expanded="false" hidden></button>
      <button id="btn-notifications" type="button" class="icon-btn notif-bell" data-tooltip="Notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="notif-bell-body" d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326Z"/>
          <path class="notif-bell-clapper" d="M10.268 21a2 2 0 0 0 3.464 0"/>
        </svg>
      </button>
      <button id="btn-theme" class="icon-btn theme-toggle" data-tooltip="Toggle theme">
        <svg class="icon-moon" viewBox="1.25 1.25 21.5 21.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5.5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button id="btn-account" type="button" class="icon-btn account-btn" data-tooltip="Sign in" aria-label="Sign in" aria-haspopup="menu" aria-expanded="false" hidden></button>
    </div>
  </header>

  <aside id="notif-panel" class="notif-panel" aria-hidden="true" aria-label="Notifications">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <span id="notif-panel-count" class="notif-panel-count" aria-hidden="true" hidden></span>
      <button id="btn-notif-clear" type="button" class="notif-panel-clear" aria-label="Clear all notifications" hidden>Clear all</button>
    </div>
    <ul id="notif-panel-list" class="notif-panel-list" role="list"></ul>
    <p id="notif-panel-empty" class="notif-panel-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>
      </svg>
      <span>No notifications</span>
    </p>
  </aside>

  <div id="toast-stack" class="toast-stack" popover="manual" aria-live="polite" aria-relevant="additions"></div>

  <!-- The page under the header is the editor's own frame (docs/UI.md §0): a
       side panel for what you can start, and beside it what you have. What
       fills each part is drawn by js/home/home.mjs; a browser with no project
       in it gets the first screen (#home-empty) instead of both. -->
  <main class="home" id="home" data-mode="arriving">
    <div class="home__column">
      <div class="home-head">
        <h1 class="home-mark" id="home-mark">BelJar</h1>
        <p class="home-head__line" id="home-signin" hidden></p>
      </div>
      <nav class="home-start" id="home-actions" aria-label="Start"></nav>
      <section class="home-projects" id="home-projects-section" aria-labelledby="home-projects-label" hidden>
        <div class="home-projects__head">
          <h2 class="home-projects__label" id="home-projects-label">Projects</h2>
          <button type="button" class="home-find" id="home-find" hidden></button>
        </div>
        <ul class="home-list" id="home-list" aria-labelledby="home-projects-label"></ul>
      </section>
      <div class="home__notes">
        <p class="home__note" id="home-waiting" role="status" hidden></p>
        <p class="home__note" id="home-news" role="status" hidden></p>
        <p class="home__note home__note--warning" id="home-risk" hidden></p>
      </div>
      <footer class="home-foot" id="home-links"></footer>
    </div>
  </main>

  <div id="tooltip-root" class="tooltip-root" role="tooltip" hidden></div>
  <div id="menu-root" class="menu-root"></div>

  <script src="js/boot/error-hook.js"></script>
  <script src="js/home.js"></script>
  <span id="home-drawn" hidden></span>
</body>

</html>
