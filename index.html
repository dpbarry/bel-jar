<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>
    window.BELJAR_SPLIT_KEY = 'beljar-editor-split';
    window.BELJAR_SPLIT_MIN = 0.18;
    window.BELJAR_SPLIT_MAX = 0.82;
    window.BELJAR_SPLIT_DEFAULT = 0.5;
    (function () {
      var SPLIT_KEY = window.BELJAR_SPLIT_KEY;
      var SPLIT_MIN = window.BELJAR_SPLIT_MIN;
      var SPLIT_MAX = window.BELJAR_SPLIT_MAX;
      var SPLIT_DEFAULT = window.BELJAR_SPLIT_DEFAULT;
      var STACK_MQ = '(max-width: 48rem)';

      function clampSplit(n) {
        if (!isFinite(n)) return SPLIT_DEFAULT;
        if (n < SPLIT_MIN) return SPLIT_MIN;
        if (n > SPLIT_MAX) return SPLIT_MAX;
        return n;
      }

      function applySplitVars(ratio) {
        var root = document.documentElement.style;
        var rest = 1 - ratio;
        if (window.matchMedia(STACK_MQ).matches) {
          root.removeProperty('--workspace-split-cols');
          root.setProperty(
            '--workspace-split-rows',
            'minmax(8rem, ' + ratio + 'fr) minmax(8rem, ' + rest + 'fr)'
          );
        } else {
          root.removeProperty('--workspace-split-rows');
          root.setProperty(
            '--workspace-split-cols',
            'minmax(12rem, ' + ratio + 'fr) minmax(12rem, ' + rest + 'fr)'
          );
        }
      }

      try {
        if (localStorage.getItem('beljar-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
        applySplitVars(clampSplit(parseFloat(localStorage.getItem(SPLIT_KEY))));
        function applyStoredPanelPx(key, cssVar) {
          var n = parseFloat(localStorage.getItem(key));
          if (isFinite(n) && n > 0) document.documentElement.style.setProperty(cssVar, n + 'px');
        }
        applyStoredPanelPx('beljar-explorer-w', '--explorer-w');
        applyStoredPanelPx('beljar-inspector-w', '--inspector-w');
        applyStoredPanelPx('beljar-explorer-h', '--explorer-h');
        applyStoredPanelPx('beljar-inspector-h', '--inspector-h');
      } catch (_) {}
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>BelJar</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div class="header-start">
      <div class="header-brand" aria-hidden="true">

          <path d="M 25 72 Q 40 60, 55 68 T 75 62 V 80 H 25 Z" fill="currentColor" fill-opacity="0.15" stroke="none" />
          <path d="M 25 65 Q 37.5 50, 50 60 T 75 55" stroke-width="3" />
          <path d="M 44 20 V 14 C 44 9, 56 9, 56 14 V 20 Z" fill="currentColor" fill-opacity="0.15" />
          <path d="M 25 80 V 45 A 25 25 0 0 1 75 45 V 80" />
          <path d="M 33 45 A 17 17 0 0 1 42 30" stroke-width="4" opacity="0.4" />

      </div>
      <nav class="header-menu" aria-label="Application menu">
        <button type="button" class="header-menu-btn" id="menu-project" aria-haspopup="menu" aria-expanded="false">Project</button>
        <button type="button" class="header-menu-btn" id="menu-edit" aria-haspopup="menu" aria-expanded="false">Edit</button>
        <button type="button" class="header-menu-btn" id="menu-tools" aria-haspopup="menu" aria-expanded="false">Tools</button>

    <div class="header-context" id="header-context" data-tooltip-placement="below" aria-label="Untitled">

    <div class="header-end">
      <button id="btn-notifications" type="button" class="icon-btn notif-bell" data-tooltip="Notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">

        </svg>

      </button>
      <button id="btn-theme" class="icon-btn theme-toggle" data-tooltip="Toggle theme">
        <svg class="icon-moon" viewBox="1.25 1.25 21.5 21.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5.5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <aside id="notif-panel" class="notif-panel" aria-hidden="true" aria-label="Notifications">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button id="btn-notif-clear" type="button" class="icon-btn" data-tooltip="Clear all" aria-label="Clear all notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5h18"/><path d="M19 5v15c0 1-1 2-2 2H7c-1 0-2-1-2-2V5"/><path d="M8 5V3c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      </button>
    </div>
    <ul id="notif-panel-list" class="notif-panel-list" role="list"></ul>
    <p id="notif-panel-empty" class="notif-panel-empty">No notifications</p>
  </aside>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-relevant="additions"></div>

  <div class="workspace">
    <aside class="sidebar">
      <button id="btn-files" type="button" class="icon-btn icon-btn-lg" data-tooltip="Explorer" aria-pressed="false" aria-controls="explorer-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
        </svg>
      </button>
      <button id="btn-inspector" type="button" class="icon-btn icon-btn-lg" data-tooltip="Inspector" aria-pressed="false" aria-controls="inspector-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button id="btn-library" type="button" class="icon-btn icon-btn-lg" data-tooltip="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="5" rx="1"/>
          <path d="M3.5 8v12.25a1.75 1.75 0 0 0 1.75 1.75h14a1.75 1.75 0 0 0 1.75-1.75V8"/>
          <path d="m8.65 12.6-2.2 2.1 2.2 2.1"/>
          <path d="m15.35 12.6 2.2 2.1-2.2 2.1"/>
          <path d="m12.85 11.6-1.7 6"/>
        </svg>
      </button>
      <div class="sidebar-fill" aria-hidden="true"></div>
      <button id="btn-settings" type="button" class="icon-btn icon-btn-lg" data-tooltip="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g transform="translate(12 12) scale(1.08) translate(-12 -12)">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </g>
        </svg>
      </button>
    </aside>

    <div id="explorer-panel" class="panel explorer-panel" aria-hidden="true">
      <div class="panel-header">
        <span class="panel-label">Explorer</span>
        <button id="btn-explorer-new" type="button" class="icon-btn" data-tooltip="New file or folder" aria-label="New file or folder" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="explorer-tree" role="tree" aria-label="Project files"></div>
    </div>

    <div id="inspector-panel" class="panel inspector-panel" aria-hidden="true">
      <div class="panel-header">
        <span class="panel-label">Inspector</span>
      </div>
      <div class="inspector-body">
        <p class="inspector-empty-note">Place the cursor on a symbol.</p>
      </div>
    </div>

    <div class="workspace-panes">
    <div class="panel editor-panel">
      <div class="editor-topbar">
        <div class="editor-tabs" id="editor-tabs" role="tablist" aria-label="Open files"></div>
        <div class="editor-topbar-controls">
          <span class="ide-status-dot" id="ide-status-dot" role="status" tabindex="0" data-tooltip-head data-tooltip="Lint has not run" aria-label="Lint has not run"></span>
          <button id="btn-load" type="button" class="icon-btn" data-tooltip="Run suite to here&#10;Ctrl+click: run suite" aria-label="Run suite to here">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 3 20 12 5 21V3Z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="editor" class="editor-cm-host" aria-label="Beluga source editor"></div>
    </div>

    <div class="panel output-panel">
      <div class="panel-header output-panel-header" id="output-panel-header">
        <div class="output-header-progress" id="output-header-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true"></div>
        <span class="panel-label" id="output-panel-label">
          Output<span class="output-header-status" id="output-header-status" aria-hidden="true"> (running)</span>
        </span>
        <button id="btn-clear" class="icon-btn" data-tooltip="Clear" aria-label="Clear output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18"/><path d="M19 5v15c0 1-1 2-2 2H7c-1 0-2-1-2-2V5"/><path d="M8 5V3c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </button>
      </div>
      <div id="output" class="repl-log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="repl-bar">
        <div class="repl-input-shell">
          <span class="repl-prompt" aria-hidden="true">&#x276F;</span>
          <input id="command-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="REPL command…" aria-label="REPL command">
          <button id="btn-run" type="button" class="repl-send" data-tooltip="Run command">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="21" x2="12" y2="3"/><polyline points="4 12 12 4 20 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    </div>
    <script>
      (function () {
        try {
          var ws = document.querySelector('.workspace');
          if (!ws) return;
          var explorerOpen = localStorage.getItem('beljar-explorer-open') === '1';
          var inspectorOpen = localStorage.getItem('beljar-inspector-open') === '1';
          if (inspectorOpen) {
            ws.classList.add('is-inspector-open');
            var ip = document.getElementById('inspector-panel');
            if (ip) ip.setAttribute('aria-hidden', 'false');
            var ib = document.getElementById('btn-inspector');
            if (ib) {
              ib.classList.add('is-active');
              ib.setAttribute('aria-pressed', 'true');
            }
          } else if (explorerOpen) {
            ws.classList.add('is-explorer-open');
            var ep = document.getElementById('explorer-panel');
            if (ep) ep.setAttribute('aria-hidden', 'false');
            var fb = document.getElementById('btn-files');
            if (fb) {
              fb.classList.add('is-active');
              fb.setAttribute('aria-pressed', 'true');
            }
          }
        } catch (_) {}
      })();
    </script>
  </div>

  <div id="tooltip-root" class="tooltip-root" role="tooltip" hidden></div>
  <div id="menu-root" class="menu-root"></div>

  <script>
    window.onerror = function (msg, url, line) {
      var lineMsg = msg + ' (line ' + line + ')';
      if (window.BelJarToasts && BelJarToasts.error) {
        BelJarToasts.error('[JS ERROR] ' + lineMsg, { duration: 0, closable: true });
      } else if (window.BelJarRepl && BelJarRepl.appendBuffered) {
        BelJarRepl.appendBuffered('[JS ERROR] ' + lineMsg, 'error');
      } else {
        var o = document.getElementById('output');
        o.textContent = (o.textContent ? o.textContent + '\n' : '') + '[JS ERROR] ' + lineMsg;
      }
    };
  </script>

  <script src="js/dialog.js"></script>

  <script src="js/conflict-dialog.js"></script>

  <script src="js/explorer-inline-name.js"></script>

</body>
